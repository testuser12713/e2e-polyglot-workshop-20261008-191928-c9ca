[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-invoice-worker"
version = "0.1.0"
description = "Invoice worker for the workshop customer portal: consumes completed orders from Valkey and writes invoices to PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
